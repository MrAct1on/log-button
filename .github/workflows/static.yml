name: Deploy static content to Pages

on:
  push:
    branches: ["GitAction"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build dist for Pages
        run: |
          rm -rf dist
          mkdir -p dist

          # Copy ONLY the files Pages needs to serve
          cp packages.yml dist/packages.yml
          cp log_button.yml dist/log_button.yml
          cp log_button.js dist/log_button.js
          cp log_button.css dist/log_button.css

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
